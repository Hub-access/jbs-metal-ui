const icons={bolt:'<path d="m13 2-9 12h7l-1 8 10-13h-7z"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',pet:'<path d="M4 9 3 3l6 3h6l6-3-1 6v6a8 6 0 0 1-16 0Z"/><path d="M8 12v1m8-1v1m-6 4 2 1 2-1"/>',crown:'<path d="m3 6 5 5 4-8 4 8 5-5-2 13H5Z"/><path d="M6 16h12"/>',weight:'<path d="M7 12h10M4 7v10m3-12v14M17 5v14m3-12v10"/>',spark:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/>'};

const nav=$('.navigation'), cards=$('#cards');
let category='main',chosen=null,query='',paused=false,closed=false,expanded=false,clock=0,frame=0,last=0,raf=0,needsPaint=true,pointer=.5;
scene.navigation.forEach((item,i)=>{const b=document.createElement('button');b.className='nav';b.dataset.id=item.id;b.setAttribute('aria-selected',String(i===0));b.innerHTML=icon(item.icon)+`<span>${item.label}</span><span class="nav-index">0${i+1}</span>`;b.addEventListener('click',()=>selectPage(item.id));nav.append(b)});

document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||!b.closest('.shell'))return;const r=b.getBoundingClientRect(),s=parseFloat($('#fit').style.getPropertyValue('--scale'))||1;const wave=document.createElement('i');wave.className='ripple';wave.style.left=(e.clientX-r.left)/s+'px';wave.style.top=(e.clientY-r.top)/s+'px';b.append(wave);wave.addEventListener('animationend',()=>wave.remove(),{once:true})});

// Two cached glyph surfaces. No DOM node or animation per small emblem.
const surfaces=$$('.material').map(canvas=>{const w=canvas.parentElement.classList.contains('content')?628:350,h=619,dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;const base=document.createElement('canvas');base.width=canvas.width;base.height=canvas.height;const b=base.getContext('2d');b.scale(dpr,dpr);b.font=`700 ${scene.pattern.size}px Arial`;b.textBaseline='top';const metal=b.createLinearGradient(0,0,0,14);[['0','#9f63b9'],['.24','#f5b4e5'],['.34','#fff0fc'],['.40','#854899'],['.63','#b56bd9'],['1','#ec98d4']].forEach(([p,c])=>metal.addColorStop(+p,c));let count=0;for(let row=0,y=13;y<h-15;row++,y+=scene.pattern.pitchY){for(let x=12+(row%2)*21;x<w-28;x+=42){b.save();b.translate(x,y);b.fillStyle=metal;b.globalAlpha=.72;b.fillText('JBS',0,0);b.restore();count++}}return{canvas,base,w,h,dpr,ctx:canvas.getContext('2d'),count}});
function paint(t){for(const s of surfaces){const {ctx:c,w,h,dpr}=s;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,s.canvas.width,s.canvas.height);c.drawImage(s.base,0,0);c.setTransform(dpr,0,0,dpr,0,0);c.globalCompositeOperation='source-atop';let beam=((t/7.2)%1)*(w+h*.52+330)-180;const grad=c.createLinearGradient(beam-125,0,beam+140,-130+(pointer-.5)*70);grad.addColorStop(0,'#ff4fd800');grad.addColorStop(.24,'#d550f035');grad.addColorStop(.39,'#f898e9c0');grad.addColorStop(.46,'#ffe6fa');grad.addColorStop(.50,'#ffe6fa');grad.addColorStop(.54,'#220d31e8');grad.addColorStop(.61,'#a855f7e8');grad.addColorStop(.76,'#d8b4fe88');grad.addColorStop(1,'#a855f700');c.fillStyle=grad;c.fillRect(0,0,w,h);c.globalCompositeOperation='source-over'}}
for(let i=0;i<16;i++){const star=document.createElement('i');star.className='spark'+(i%4===0?' star':'');star.style.cssText=`left:${6+(i*37)%90}%;top:${i<6?5+(i*7)%12:85+(i*3)%11}%;--duration:${3+i%5}s;--delay:-${i*.77}s`;$('.sparkles').append(star)}

function tick(now){if(!running())return;if(!last)last=now;const delta=Math.min((now-last)/1000,.1);last=now;clock+=delta;frame++;if(frame%2===0||needsPaint){paint(clock);needsPaint=false}const intro=clock<3.2;$('#phase').textContent=intro?'登场 · 边缘点亮':'金属阵列 · 动态反射';$('.notice').classList.toggle('show',clock>2.4&&clock<4.8);window.JBSMotion={frame,seconds:clock,paused,closed,category,selected:chosen,marks:surfaces.map(s=>s.count)};raf=requestAnimationFrame(tick)}

function hide(){closed=true;$('#stage').classList.add('closed');syncLife()}$('#close').onclick=hide;$('#minimize').onclick=hide;$('#restore').onclick=replay;$('#replay').onclick=replay;$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'继续动效':'暂停动效';syncLife()};$('#expand').onclick=()=>{expanded=!expanded;$('#expand').setAttribute('aria-label',expanded?'还原窗口':'放大窗口');fit()};document.addEventListener('visibilitychange',syncLife);window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));window.addEventListener('pageshow',syncLife);
if(motionPreference)motionPreference.addEventListener('change',syncLife);
renderCards();fit();paint(0);syncLife();
</script>
